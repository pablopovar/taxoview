<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cazadores y recolectores</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-line"><h1>arraigado en el lugar.</h1><p id="item-count">Abriendo los datos…</p></div>
    <div class="taxon-search"><input id="taxon-search" type="search" placeholder="Buscar especies o grupos en iNaturalist" aria-label="Buscar especies o grupos en iNaturalist"><div id="taxon-results" class="taxon-results" hidden></div></div>
    <button class="button button-primary" id="new-category" type="button">+ Nueva categoría</button>
  </header>
  <main>
    <section id="species-page" class="species-page" hidden></section>
    <div class="category-board-wrap">
      <button class="stack-toggle stack-toggle-left" id="hide-stacks-left" type="button" aria-label="Ocultar grupos laterales" title="Ocultar grupos laterales">‹</button>
      <div class="category-board" id="category-board"></div>
      <button class="stack-toggle stack-toggle-right" id="hide-stacks-right" type="button" aria-label="Ocultar grupos laterales" title="Ocultar grupos laterales">›</button>
    </div>
    <div class="message" id="message" role="status" hidden></div>
  </main>
  <dialog id="item-dialog">
    <form id="item-form">
      <div class="dialog-heading">
        <div><p class="eyebrow" id="form-category">CATEGORÍA</p><h2 id="form-title">Agregar registro</h2></div>
        <button class="icon-button" id="close-dialog" type="button" aria-label="Cerrar">×</button>
      </div>
      <div id="record-fields"></div>
      <p class="field-hint">Las imágenes se guardan como archivos junto a los datos de texto.</p>
      <div class="dialog-actions">
        <button class="button button-quiet" id="cancel-dialog" type="button">Cancelar</button>
        <button class="button button-primary" id="save-item" type="submit">Guardar registro</button>
      </div>
    </form>
  </dialog>
  <dialog id="category-dialog">
    <form id="category-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">NUEVA CATEGORÍA</p><h2>Definir una vista</h2></div>
        <button class="icon-button" id="close-category-dialog" type="button" aria-label="Cerrar">×</button>
      </div>
      <label class="form-field"><span>Nombre de la categoría</span>
        <input id="category-title" type="text" placeholder="Por ejemplo, Fauna" required maxlength="60">
      </label>
      <section class="schema-builder">
        <div class="schema-heading"><div><h3>Campos</h3><p>Elegí qué datos querés guardar en cada registro.</p></div>
          <button class="button button-quiet" id="add-schema-field" type="button">+ Agregar campo</button>
        </div>
        <div id="schema-fields" class="schema-fields"></div>
      </section>
      <div class="dialog-actions">
        <button class="button button-quiet" id="cancel-category-dialog" type="button">Cancelar</button>
        <button class="button button-primary" id="save-category" type="submit">Crear categoría</button>
      </div>
    </form>
  </dialog>
  <dialog id="map-dialog">
    <section class="map-dialog-body">
      <div class="dialog-heading">
        <div><p class="eyebrow">UBICACIONES</p><h2>Mapa del registro</h2></div>
        <button class="icon-button" id="close-map-dialog" type="button" aria-label="Cerrar">×</button>
      </div>
      <div id="map-dialog-content"></div>
      <div class="dialog-actions"><button class="button button-quiet" id="done-map-dialog" type="button">Cerrar</button></div>
    </section>
  </dialog>
</body>
</html>
